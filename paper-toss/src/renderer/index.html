<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>Paper Toss</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="A room with a trash can at the far end and a paper ball in your hand"></canvas>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="#fdfcf7" stroke="#20242b" stroke-width="2" />
          <path d="M8 13l5 3 4-5 3 6 5-2M9 20l5-1 3 4 4-3 3 2" fill="none" stroke="#20242b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        <div>
          <h1>Paper Toss</h1>
          <p>Delete things the satisfying way</p>
        </div>
      </div>

      <div id="hud" class="hud" hidden>
        <span id="hud-count" class="hud-count" hidden></span>
        <span id="hud-name" class="hud-name"></span>
        <span class="hud-sep" aria-hidden="true"></span>
        <span id="throws" class="throws" role="img" aria-label="Throws left"><i></i><i></i></span>
        <button id="keep-btn" class="btn btn-quiet btn-sm" type="button">Keep it <kbd>Esc</kbd></button>
        <button id="stop-btn" class="btn btn-quiet btn-sm" type="button" hidden>Stop all</button>
      </div>

      <div class="topbar-actions">
        <span id="demo-badge" class="badge" hidden>Demo mode · no real files are touched</span>
        <button id="sound-btn" class="icon-btn" type="button" aria-pressed="false" title="Sound on">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
            <path class="sound-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path class="sound-off" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div id="dock" class="dock">
      <div class="dock-buttons">
        <button id="pick-files" class="btn btn-primary btn-lg" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h8l5 5v13H6z" /><path d="M14 3v5h5" /><path d="M12.5 11v6M9.5 14h6" /></svg>
          Pick file(s)
        </button>
        <button id="pick-folder" class="btn btn-secondary btn-lg" type="button">Pick a folder</button>
      </div>
      <p id="dock-note" class="dock-note"></p>
    </div>

    <section id="sheet" class="sheet" aria-live="polite" hidden></section>

    <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    <div id="hint" class="hint" aria-live="polite" hidden></div>
    <div id="status" class="status" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="status-text"></span></div>

    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-inner">Drop to crumple them up</div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
